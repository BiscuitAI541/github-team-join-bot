name: Auto Join Ponder

on:
  issues:
    types:
      - opened

permissions:
  contents: read
  issues: write

jobs:
  verify-and-join:
    if: startsWith(github.event.issue.title, '[申请Ponder]')
    runs-on: ubuntu-latest

    steps:
      - name: Parse order number from issue body
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          ORDER=$(printf '%s' "$ISSUE_BODY" \
            | awk '/^###[[:space:]]*订单号/{f=1;next} f&&NF{gsub(/^[[:space:]]+|[[:space:]]+$/,"");print;exit}')

          if [ -z "$ORDER" ]; then
            ORDER=$(printf '%s' "$ISSUE_BODY" | grep -oE '\bP[0-9]{3,}\b' | head -1)
          fi

          if [ -n "$ORDER" ]; then
            echo "::add-mask::$ORDER"
            echo "订单号解析成功（值已隐藏）"
          else
            echo "::warning::未解析出订单号"
          fi
          echo "order_no=$ORDER" >> "$GITHUB_OUTPUT"

      - name: Get Feishu tenant token
        id: feishu_token
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          TOKEN=$(curl --fail-with-body --silent --show-error \
            -X POST "https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg app_id "$FEISHU_APP_ID" \
              --arg app_secret "$FEISHU_APP_SECRET" \
              '{app_id: $app_id, app_secret: $app_secret}')" \
            | jq -er '.tenant_access_token')
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Query bitable record
        id: verify
        env:
          ORDER_NO: ${{ steps.parse.outputs.order_no }}
          GH_LOGIN: ${{ github.event.issue.user.login }}
          FEISHU_TOKEN: ${{ steps.feishu_token.outputs.token }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
        run: |
          echo "::group::诊断输入"
          printf 'Issue 作者 login: [%s]\n' "$GH_LOGIN"
          echo "::endgroup::"

          if [ -z "$ORDER_NO" ]; then
            echo "::error::未能从 Issue 正文解析出订单号"
            exit 1
          fi

          # 仅按订单号查一次，用于诊断表格里实际存的 GitHub昵称 是什么
          DIAG_BODY=$(jq -n --arg order "$ORDER_NO" '{
            filter: {conjunction: "and", conditions: [
              {field_name: "订单号", operator: "is", value: [$order]}
            ]}
          }')
          DIAG=$(curl --silent --show-error \
            -X POST \
            "https://open.feishu.cn/open-apis/bitable/v1/apps/$FEISHU_APP_TOKEN/tables/$FEISHU_TABLE_ID/records/search" \
            -H "Authorization: Bearer $FEISHU_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$DIAG_BODY")
          echo "::group::仅按订单号匹配的结果"
          echo "$DIAG" | jq '{code: .code, msg: .msg, total: .data.total, nicknames: [.data.items[]?.fields["GitHub昵称"]]}'
          echo "::endgroup::"

          BODY=$(jq -n --arg order "$ORDER_NO" --arg login "$GH_LOGIN" '{
            filter: {
              conjunction: "and",
              conditions: [
                {field_name: "订单号", operator: "is", value: [$order]},
                {field_name: "GitHub昵称", operator: "is", value: [$login]}
              ]
            }
          }')

          RESULT=$(curl --fail-with-body --silent --show-error \
            -X POST \
            "https://open.feishu.cn/open-apis/bitable/v1/apps/$FEISHU_APP_TOKEN/tables/$FEISHU_TABLE_ID/records/search" \
            -H "Authorization: Bearer $FEISHU_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          echo "::group::精确匹配的原始响应"
          echo "$RESULT" | jq .
          echo "::endgroup::"

          COUNT=$(echo "$RESULT" | jq -er '.data.total')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Add to Ponder team
        if: steps.verify.outputs.count != '0'
        env:
          ORG_ADMIN_PAT: ${{ secrets.ORG_ADMIN_PAT }}
          ORGANIZATION: ${{ github.repository_owner }}
          GH_LOGIN: ${{ github.event.issue.user.login }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $ORG_ADMIN_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/orgs/$ORGANIZATION/teams/ponder/memberships/$GH_LOGIN"

      - name: Comment result and close
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API: https://api.github.com
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          MATCH_COUNT: ${{ steps.verify.outputs.count }}
        run: |
          if [ "$MATCH_COUNT" != "0" ]; then
            COMMENT_BODY="✅ 校验通过，已自动加入 Ponder team"
          else
            COMMENT_BODY="❌ 订单号与 GitHub 账号不匹配，申请被拒绝"
          fi

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg body "$COMMENT_BODY" '{body: $body}')" \
            "$GH_API/repos/$GH_REPO/issues/$ISSUE_NUMBER/comments"

          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d '{"state":"closed"}' \
            "$GH_API/repos/$GH_REPO/issues/$ISSUE_NUMBER"

      - name: Redact order number from issue body
        if: always() && steps.parse.outputs.order_no != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API: https://api.github.com
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ORIGINAL_BODY: ${{ github.event.issue.body }}
          ORDER_NO: ${{ steps.parse.outputs.order_no }}
        run: |
          REDACTED=$(printf '%s' "$ORIGINAL_BODY" \
            | ORDER="$ORDER_NO" awk '{gsub(ENVIRON["ORDER"], "[已脱敏]"); print}')

          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg body "$REDACTED" '{body: $body}')" \
            "$GH_API/repos/$GH_REPO/issues/$ISSUE_NUMBER" > /dev/null

          echo "订单号已从 Issue 正文中抹去"
